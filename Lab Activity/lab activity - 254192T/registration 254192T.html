<!DOCTYPE html>
<html lang="en">
<head>
    <title>Student Registration Form</title>
</head>
<body>
    <h1>Student Registration Form</h1>
    <form  method="post">
        <label for="fname">Fist Name</label>
        <input type="text" name="fname" required><br><br>

        <label for="lname">Last Name</label>
        <input type="text" name="lname" required><br><br>

        <label for="email">Email</label>
        <input type="email" name="email" placeholder="student@gmail.com" required><br><br>

        <label for="gender">Gender:</label>
        <input type="radio" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" name="gender" value="female">
        <label for="female">Female</label><br><br>

        <label for="course">Course:</label>
        <select name="course" , id="coures">  
            <option>Select course</option>
            <option value="it">IT</option>
            <option value="cs">Computer Science</option>
            <option value="se">Software Engineering</option>
        </select><br><br>

        <label for="Hobbies">Hobbies:</label>
        <input type="checkbox" name="reading" value="reading">
        <label for="reading">Reading</label>
        <input type="checkbox" , nam="sports" value="sports">
        <label for="sports">Sports</label>
        <input type="checkbox" name="Music" , value="music">
        <label for="Music">Music</label>
        <input type="checkbox" name="Travelling" , value="travelling">
        <label for="Travelling">Travelling</label><br><br>

        <label for="Aditional info">Additional Infromaton</label>
        <textarea name="info" rows="5" cols="40"></textarea><br><br>

        
        <input type="submit" name="submit" value="Submit">
        <input type="reset" name="reset" value="Reset">

        
    </form>
</body>
</html>
