<!DOCTYPE html>
<html>

<head>
    <title>Login</title>
    <link rel="stylesheet" href="prac4.css">
</head>

<body>
    <div class="container">
        <div class="login-box">
            <p class="subtitle">Login to the your account</p>
            <h2>Welcome back</h2>
            <form>
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" placeholder="Saman@gmail.com">
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password" placeholder="••••••••">
                </div>

                <div class="options">
                    <label><input type="checkbox"> Remember Me</label>
                    <a href="#">Forgot password?</a>
                </div>

                <button type="submit">Login</button>

                <p class="signup">Don't have account? <a href="#">Sign up</a></p>

            </form>
        </div>
    </div>
</body>

</html>
